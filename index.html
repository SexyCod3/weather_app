<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">

    <link rel="stylesheet" href="weather_app.css">

    <title>Weather Web App</title>
</head>

<body>

    <!---------------- Navbar ---------------->
    <div class="navbar">

        <div class="menu">
            <i class='bx bx-menu'></i>
        </div>

        <div class="calender">
            <i class='bx bx-calendar'></i>
        </div>

    </div>

    <!---------------- Content ---------------->

    <div class="content">

        <div class="kota">
        </div>

        <div class="weather">
            <i class='bx bx-cloud'></i>
        </div>

        <div class="degree">

            <div class="angka">
            </div>

            <span class="remarks">
            </span>

        </div>

        <div class="presentage">

            <div class="speed_angin">
                <i class='bx bx-wind'></i>
                <span class="speed"></span>
            </div>

            <div class="holiday">
                <i class='bx bx-water'></i>
                <span class="lembab"></span>
            </div>

        </div>

    </div>

    <!---------------- Forecast ---------------->

    <div class="forecast">

        <div class="headend">
            <i class='bx bx-history'></i>
            <span>Hourly Forecast</span>
        </div>

        <div class="tablet">

            <div class="tablet1"></div>
            <div class="tablet2"></div>
            <div class="tablet3"></div>
            <div class="tablet4"></div>

        </div>

    </div>

    <!---------------- Bottom Navigation ---------------->

    <div class="navfooter">

        <span class="home">
            <i class='bx bx-home'></i>
        </span>

        <span class="search">
            <i class='bx bx-search'></i>
        </span>

        <span class="notif">
            <i class='bx bx-bell'></i>
        </span>

        <span class="map">
            <i class='bx bx-map'></i>
        </span>

    </div>

    <!---------------- Cookie ---------------->

    <div class="bdycookies" id="bdycookies">

        <div class="main">

            <img src="https://i.pinimg.com/736x/ff/e1/0e/ffe10e8232bd6310adb73deac0889033.jpg" alt="Cookie">

            <span class="span">
                Your privacy is important to us.
                We use cookies for different purposes.
                <a href="#">Learn More</a>
            </span>

        </div>

        <div class="button">

            <button class="got" id="okay">
                <a href="#">OK</a>
            </button>

        </div>

    </div>

    <script src="weather_app.js"></script>

</body>

</html>
