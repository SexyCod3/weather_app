<html lang="id">
<head>

<body>


<!-------------------------------------->
  <div class = "navbar">
    <div class = "menu"><i class='bx bx-menu'></div></div></div>
    <div class = "calender"><i class='bx bx-calendar'></div></div></div>
  </div>

  <!---------------------------------------------------->
  <div class= "content">
    <div class ="kota">BATAM, Indonesia</div>
    <div class = "weather"><i class='bx bx-cloud'></div></div>
    <div class = "degree">
      <div class="angka">29°C</div>
      <span class="remarks">eightsomes cloudy</span>

      <div class="speed_angin">

        <i class='bx b-water'></i>
        <span>2%</span>
      </div>
    </div> 
  </div>


  <!-----part forecast----->
  <div class="forecast">
    <div class="headend">
      <i class='bx bx-history'></i>
      <span>Hourly Forecast</pan>
    </div>
    <div class = "tablet">
      <div class = "tablet1"></div>
      <div class = "tablet2"></div>
      <div class = "tablet3"></div>
      <div class = "tablet4"></div>
    </div>
  </div>


  <!----part navfooter---->
  <div class=" navfooter">
    <span class="home"><i class='bx bx-home'></i></span></span>
    <span class="search"><i class='bx bx-search'></span></span>
    <span class="notif"><i class='bx bx-bell'></i></span></span>
    <span class="map"><i class='bx bx-map'></span></span>  
  </div>
